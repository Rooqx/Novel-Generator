services:
  redis:
    image: redis:7-alpine
    container_name: nover-wrier-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: nover-wrier-server
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NODE_ENV=production
      - WORKSPACE_BASE_PATH=/workspaces
    volumes:
      - workspace_data:/workspaces
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: nover-wrier-web
    ports:
      - "4321:4321"
    environment:
      - PUBLIC_SERVER_URL=http://localhost:3000
    depends_on:
      - server
    restart: unless-stopped

volumes:
  redis_data:
  workspace_data:
